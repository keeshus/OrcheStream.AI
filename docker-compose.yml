services:
  postgres:
    # postgres:17-alpine pinned by digest
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: orchestream-ai-db
    # Bind to loopback only — DB must not be exposed to the network
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # WARNING: Change these credentials for any non-local deployment
      POSTGRES_USER: orchestream_ai
      POSTGRES_PASSWORD: orchestream_ai
      POSTGRES_DB: orchestream_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: pg_isready -U orchestream_ai
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    # qdrant/qdrant:v1.18.0 pinned by digest
    image: qdrant/qdrant:v1.18.0@sha256:b3063c673f3973877c038eeecc392bad5011f072ee7892b56c9a8e204a3bdea9
    container_name: orchestream-ai-qdrant
    # Bind to loopback only
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  valkey:
    # valkey/valkey:7-alpine pinned by digest
    image: valkey/valkey:7-alpine@sha256:211d9cb02395987d3740b11fdbb7be0cb66c5f36a065640ce5753c933700d6cc
    container_name: orchestream-ai-valkey
    # Bind to loopback only
    ports:
      - "127.0.0.1:6379:6379"
    command: valkey-server --requirepass ${VALKEY_PASSWORD:-dev-valkey}
    restart: always

  sidecar:
    build:
      context: .
      dockerfile: sidecar/Dockerfile
    container_name: orchestream-ai-sidecar
    # The sidecar image runs as UID 1001 — the tmpfs must be owned by it or
    # sandbox setup fails with EACCES.
    tmpfs:
      - /var/flow-data:uid=1001,gid=0,mode=700
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      - SIDECAR_TOKEN=${SIDECAR_TOKEN:-dev-sidecar-token-change-me}
    restart: unless-stopped

  backend:
    container_name: orchestream-ai-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PORT=3001
      - DATABASE_URL=postgres://orchestream_ai:orchestream_ai@postgres:5432/orchestream_ai
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - SIDECAR_URL=http://sidecar:4001
      - SIDECAR_TOKEN=${SIDECAR_TOKEN:-dev-sidecar-token-change-me}
      - VALKEY_HOST=valkey
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:-dev-valkey}
      - SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY}
    restart: always
    # Plain node app: drop all Linux capabilities and reap zombie processes
    cap_drop:
      - ALL
    init: true
    # node:24-alpine ships no curl/wget — use Node's built-in fetch
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    container_name: orchestream-ai-worker
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: always
    cap_drop:
      - ALL
    init: true
    environment:
      - VALKEY_HOST=valkey
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:-dev-valkey}
      - SIDECAR_URL=http://sidecar:4001
      - SIDECAR_TOKEN=${SIDECAR_TOKEN:-dev-sidecar-token-change-me}
      - DATABASE_URL=postgres://orchestream_ai:orchestream_ai@postgres:5432/orchestream_ai
    depends_on:
      - valkey
      - sidecar

  frontend:
    container_name: orchestream-ai-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    restart: always
    cap_drop:
      - ALL
    init: true

  proxy:
    container_name: orchestream-ai-proxy
    # nginx:1.27-alpine pinned by digest
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  qdrant_data:
