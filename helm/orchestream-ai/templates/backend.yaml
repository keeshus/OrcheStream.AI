apiVersion: v1
kind: Service
metadata:
  name: {{ include "orchestream-ai.fullname" . }}-backend
  labels:
    {{- include "orchestream-ai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.backendPort }}
      targetPort: {{ .Values.backend.port }}
      protocol: TCP
      name: http
  selector:
    app: {{ include "orchestream-ai.fullname" . }}-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orchestream-ai.fullname" . }}-backend
  labels:
    {{- include "orchestream-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "orchestream-ai.fullname" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "orchestream-ai.fullname" . }}-backend
    spec:
      # Pod-level hardening: run as non-root, restrict to the default seccomp profile
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: flow-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}-backend:{{ .Values.image.tag }}"
          command: ["sh", "-c"]
          args:
            - |
              echo "Running database migrations..."
              # Run migrations via the backend's migrate script
              cd /app && node backend/dist/db/migrate.js
          envFrom:
            - secretRef:
                name: {{ include "orchestream-ai.secretName" . }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}-backend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: PORT
              value: {{ .Values.backend.port | quote }}
            - name: SIDECAR_URL
              value: "http://localhost:4001"
            - name: SIDECAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "orchestream-ai.secretName" . }}
                  key: sidecar-token
          envFrom:
            - secretRef:
                name: {{ include "orchestream-ai.secretName" . }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
        - name: sidecar
          image: "{{ .Values.image.repository }}-sidecar:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 4001
              name: sidecar
          args: ["--ttl-hours=168"]
          env:
            - name: SIDECAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "orchestream-ai.secretName" . }}
                  key: sidecar-token
          volumeMounts:
            - name: flow-data
              mountPath: /var/flow-data
          securityContext:
            readOnlyRootFilesystem: true
            runAsUser: 1001
            runAsNonRoot: true
            # Landlock works unprivileged: landlock-helper sets PR_SET_NO_NEW_PRIVS
            # itself, so no extra capabilities are needed — drop everything.
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.sidecar.resources | nindent 12 }}
