apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orchestream-ai.fullname" . }}-worker
  labels:
    {{- include "orchestream-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "orchestream-ai.fullname" . }}-worker
  template:
    metadata:
      labels:
        app: {{ include "orchestream-ai.fullname" . }}-worker
    spec:
      # Pod-level hardening: run as non-root, restrict to the default seccomp profile
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: flow-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}-worker:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: VALKEY_HOST
              value: {{ include "orchestream-ai.fullname" . }}-valkey
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "orchestream-ai.secretName" . }}
                  key: valkey-password
            - name: SIDECAR_URL
              value: "http://localhost:4001"
            - name: SIDECAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "orchestream-ai.secretName" . }}
                  key: sidecar-token
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "orchestream-ai.secretName" . }}
                  key: database-url
          envFrom:
            - secretRef:
                name: {{ include "orchestream-ai.secretName" . }}
          # The worker is a BullMQ consumer with no HTTP server of its own —
          # probe the backend Service (same release, cluster-internal DNS) as
          # a proxy for cluster availability. NOT localhost: the worker pod
          # does not listen on 3001.
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://{{ include "orchestream-ai.fullname" . }}-backend:{{ .Values.backend.port }}/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
        - name: sidecar
          image: "{{ .Values.image.repository }}-sidecar:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 4001
              name: sidecar
          args: ["--ttl-hours=168"]
          env:
            - name: SIDECAR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "orchestream-ai.secretName" . }}
                  key: sidecar-token
          volumeMounts:
            - name: flow-data
              mountPath: /var/flow-data
          securityContext:
            readOnlyRootFilesystem: true
            runAsUser: 1001
            runAsNonRoot: true
            # Landlock works unprivileged: landlock-helper sets PR_SET_NO_NEW_PRIVS
            # itself, so no extra capabilities are needed — drop everything.
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.sidecar.resources | nindent 12 }}
