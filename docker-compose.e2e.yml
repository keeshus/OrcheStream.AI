# ── OrcheStream.AI E2E Test (app + infra in Docker, Playwright on host) ─
# Start:  docker compose -f docker-compose.e2e.yml up -d --wait
# Stop:   docker compose -f docker-compose.e2e.yml down -v --timeout 10
# Run:    npx playwright test --config frontend/playwright.config.ts
# Debug:  npx playwright test --config frontend/playwright.config.ts --headed

services:
  postgres-e2e:
    image: postgres:17-alpine
    container_name: orchestream-ai-e2e-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orchestream_ai
      POSTGRES_PASSWORD: orchestream_ai
      POSTGRES_DB: orchestream_ai
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestream_ai"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  qdrant-e2e:
    image: qdrant/qdrant:v1.18.0
    container_name: orchestream-ai-e2e-qdrant
    ports:
      - "6333:6333"
    tmpfs: /qdrant/storage
    restart: unless-stopped

  valkey-e2e:
    image: valkey/valkey:7-alpine
    container_name: orchestream-ai-e2e-valkey
    ports:
      - "6379:6379"
    command: valkey-server --requirepass dev-valkey
    tmpfs: /data
    restart: unless-stopped

  db-migrate-e2e:
    # node:24-alpine (current LTS) pinned by digest — node:25 is EOL since 2026-03-31
    image: node:24-alpine@sha256:f70403e87646dc51b45295f4b8b70cdad0b63d2297c4c9899119b03f7af7a6b3
    container_name: orchestream-ai-e2e-migrate
    working_dir: /repo
    volumes:
      - .:/repo
    entrypoint:
      - sh
      - -c
      - cd backend && DATABASE_URL=postgres://orchestream_ai:orchestream_ai@postgres-e2e:5432/orchestream_ai npx drizzle-kit push --config drizzle.config.ts
    depends_on:
      postgres-e2e:
        condition: service_healthy

  backend-e2e:
    build:
      context: .
      dockerfile: backend/Dockerfile.e2e
    container_name: orchestream-ai-e2e-backend
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://orchestream_ai:orchestream_ai@postgres-e2e:5432/orchestream_ai
      JWT_SECRET: e2e-test-secret
      NODE_ENV: e2e
      FRONTEND_URL: http://localhost:3000
      VALKEY_HOST: valkey-e2e
      VALKEY_PASSWORD: dev-valkey
      SECRETS_ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      SIDECAR_URL: http://sidecar-e2e:4001
      SIDECAR_TOKEN: e2e-sidecar-token
    depends_on:
      postgres-e2e:
        condition: service_healthy
      db-migrate-e2e:
        condition: service_completed_successfully
      mock-oidc-e2e:
        condition: service_started
      sidecar-e2e:
        condition: service_started

  frontend-e2e:
    build:
      context: .
      dockerfile: frontend/Dockerfile.e2e
    container_name: orchestream-ai-e2e-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend-e2e:3001
      NEXT_PUBLIC_API_URL: /api
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend-e2e

  worker-e2e:
    build:
      context: .
      dockerfile: worker/Dockerfile.e2e
    container_name: orchestream-ai-e2e-worker
    environment:
      DATABASE_URL: postgres://orchestream_ai:orchestream_ai@postgres-e2e:5432/orchestream_ai
      VALKEY_HOST: valkey-e2e
      VALKEY_PASSWORD: dev-valkey
      SECRETS_ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      SIDECAR_URL: http://sidecar-e2e:4001
      SIDECAR_TOKEN: e2e-sidecar-token
    depends_on:
      postgres-e2e:
        condition: service_healthy
      db-migrate-e2e:
        condition: service_completed_successfully
      valkey-e2e:
        condition: service_started
      sidecar-e2e:
        condition: service_started

  sidecar-e2e:
    build:
      context: .
      dockerfile: sidecar/Dockerfile.e2e
    container_name: orchestream-ai-e2e-sidecar
    tmpfs:
      - /var/flow-data:uid=1001,gid=0,mode=700
    environment:
      SIDECAR_TOKEN: e2e-sidecar-token
    ports:
      - "127.0.0.1:4001:4001"

  mock-llm-e2e:
    build:
      context: ./test/mock-llm
      dockerfile: Dockerfile
    container_name: orchestream-ai-e2e-mock-llm
    ports:
      - "3002:3002"

  mock-mcp-e2e:
    build:
      context: ./test/mock-mcp
      dockerfile: Dockerfile
    container_name: orchestream-ai-e2e-mock-mcp
    ports:
      - "3003:3003"

  mock-oidc-e2e:
    build:
      context: ./test/mock-oidc
      dockerfile: Dockerfile
    container_name: orchestream-ai-e2e-mock-oidc
    ports:
      - "3004:3004"

  mock-cyberark-e2e:
    build:
      context: ./test/mock-cyberark
      dockerfile: Dockerfile
    container_name: orchestream-ai-e2e-mock-cyberark
    ports:
      - "3005:3005"

networks:
  default:
    name: orchestream-ai-e2e
